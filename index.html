<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ruleta Aleatoria</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(160deg, #0f0c29, #1a1a4e, #16213e);
    min-height: 100vh;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 15px;
  }

  h1 {
    font-size: 2.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .subtitle {
    color: #a0aec0;
    margin-bottom: 22px;
    font-size: 1.05rem;
  }

  .main-container {
    display: flex;
    gap: 35px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    max-width: 1300px;
    width: 100%;
  }

  .wheel-section {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wheel-wrapper {
    position: relative;
    width: 560px;
    height: 560px;
  }

  canvas {
    border-radius: 50%;
    box-shadow: 
      0 0 0 10px #0f0c29,
      0 0 0 18px #ff4757,
      0 15px 45px rgba(0,0,0,0.55);
  }

  .pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 44px solid #ff4757;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }

  .pointer::after {
    content: '';
    position: absolute;
    top: -50px;
    left: -8px;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    border: 3px solid #ff4757;
  }

  .center-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 110px;
    height: 110px;
    background: #111;
    border-radius: 50%;
    border: 6px solid #ff4757;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 700;
    font-size: 0.85rem;
    line-height: 1.25;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 0 28px rgba(255,71,87,0.55);
    transition: 0.25s;
    color: white;
    user-select: none;
  }

  .center-btn:hover {
    transform: translate(-50%, -50%) scale(1.07);
  }

  .controls {
    margin-top: 26px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    padding: 12px 26px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 0.98rem;
    transition: 0.25s;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
  }

  .btn-spin {
    background: linear-gradient(90deg, #ff6b6b, #ee5a24);
    color: white;
  }
  .btn-spin:hover { transform: translateY(-3px); }

  .btn-reset {
    background: linear-gradient(90deg, #a29bfe, #6c5ce7);
    color: white;
  }
  .btn-reset:hover { transform: translateY(-3px); }

  .btn-edit {
    background: linear-gradient(90deg, #00b894, #00cec9);
    color: white;
  }
  .btn-edit:hover { transform: translateY(-3px); }

  .side-panel {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(14px);
    border-radius: 24px;
    padding: 22px;
    width: 320px;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .side-panel h2 {
    font-size: 1.3rem;
    color: #feca57;
    margin-bottom: 12px;
  }

  #namesList {
    width: 100%;
    height: 340px;
    background: rgba(0,0,0,0.35);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 12px;
    color: #fff;
    font-size: 0.98rem;
    line-height: 1.6;
    resize: none;
    font-family: 'Poppins', sans-serif;
  }

  .list-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  .list-actions button {
    flex: 1;
    padding: 10px;
    font-size: 0.92rem;
  }

  .winner-box {
    margin-top: 22px;
    text-align: center;
    min-height: 65px;
  }

  .winner-text {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(90deg, #feca57, #ff9ff3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .history {
    margin-top: 16px;
    font-size: 0.92rem;
    color: #a0aec0;
    text-align: center;
    max-width: 560px;
  }

  .history span {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    padding: 3px 11px;
    border-radius: 20px;
    margin: 3px;
  }

  .keyboard-help {
    margin-top: 16px;
    font-size: 0.8rem;
    color: #718096;
    line-height: 1.65;
  }

  .keyboard-help kbd {
    background: #2d3748;
    padding: 2px 7px;
    border-radius: 4px;
    font-family: monospace;
  }

  .info-capacity {
    margin-top: 8px;
    font-size: 0.78rem;
    color: #68d391;
    text-align: center;
  }

  @media (max-width: 1000px) {
    .wheel-wrapper { width: 420px; height: 420px; }
    canvas { width: 420px; height: 420px; }
    h1 { font-size: 2.1rem; }
  }
</style>
</head>
<body>

<h1>La Ruleta Aleatoria</h1>
<p class="subtitle">Gira y descubre al afortunado</p>

<div class="main-container">
  <div class="wheel-section">
    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheel" width="560" height="560"></canvas>
      <div class="center-btn" id="centerBtn">HAZ CLIC<br>PARA<br>GIRAR</div>
    </div>

    <div class="controls">
      <button class="btn-spin" id="spinBtn">Iniciar</button>
      <button class="btn-reset" id="resetBtn">Reiniciar</button>
      <button class="btn-edit" id="editBtn">Editar lista</button>
    </div>

    <div class="winner-box">
      <div id="winnerText" class="winner-text"></div>
    </div>
    <div class="history" id="history"></div>
  </div>

  <div class="side-panel">
    <h2>Participantes</h2>
    <textarea id="namesList" placeholder="Escribe un nombre por línea..."></textarea>

    <div class="list-actions">
      <button class="btn-edit" onclick="updateWheel()">Actualizar</button>
      <button class="btn-reset" onclick="clearList()">Limpiar</button>
    </div>
    <div class="info-capacity" id="capacityInfo">0 / 50 personas</div>

    <div class="keyboard-help">
      <p><kbd>ESPACIO</kbd> Girar</p>
      <p><kbd>R</kbd> Reiniciar</p>
      <p><kbd>E</kbd> Editar lista</p>
      <p><kbd>F</kbd> Pantalla completa</p>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const resetBtn = document.getElementById('resetBtn');
  const centerBtn = document.getElementById('centerBtn');
  const winnerText = document.getElementById('winnerText');
  const historyEl = document.getElementById('history');
  const namesList = document.getElementById('namesList');
  const capacityInfo = document.getElementById('capacityInfo');

  // Un solo carácter invisible (se repite según el nivel)
  const INVISIBLE = '\u200B';

  const colors = [
    '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
    '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9',
    '#F1948A', '#82E0AA', '#F8C471', '#AED6F1', '#D7BDE2',
    '#F5B7B1', '#A9DFBF', '#F9E79F', '#D2B4DE', '#AED6F1'
  ];

  let names = [];
  let forcedWinners = [];
  let currentRotation = 0;
  let isSpinning = false;
  let winnersHistory = [];

  function getFontSize(count) {
    if (count <= 12) return 18;
    if (count <= 20) return 15;
    if (count <= 30) return 13;
    if (count <= 40) return 11;
    return 10;
  }

  function drawWheel() {
    const center = canvas.width / 2;
    const radius = center - 10;
    const total = Math.max(names.length, 1);
    const slice = (2 * Math.PI) / total;
    const fontSize = getFontSize(names.length);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (names.length === 0) {
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2 * Math.PI);
      ctx.fillStyle = '#2d3748';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px Poppins';
      ctx.textAlign = 'center';
      ctx.fillText('Agrega nombres', center, center);
      updateCapacity();
      return;
    }

    names.forEach((name, i) => {
      const start = i * slice - Math.PI / 2;
      const end = start + slice;

      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(start + slice / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${fontSize}px Poppins`;
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 3;

      let displayName = name;
      if (names.length > 35 && name.length > 10) {
        displayName = name.substring(0, 9) + '…';
      } else if (names.length > 25 && name.length > 12) {
        displayName = name.substring(0, 11) + '…';
      }

      ctx.fillText(displayName, radius - 18, 5);
      ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(center, center, 52, 0, 2 * Math.PI);
    ctx.fillStyle = '#111';
    ctx.fill();
    ctx.strokeStyle = '#ff4757';
    ctx.lineWidth = 6;
    ctx.stroke();

    updateCapacity();
  }

  function updateCapacity() {
    capacityInfo.textContent = `${names.length} / 50 personas`;
    capacityInfo.style.color = names.length > 50 ? '#fc8181' : '#68d391';
  }

  namesList.addEventListener('keydown', function(e) {
    if (e.key === ',') {
      e.preventDefault();

      const textarea = this;
      const start = textarea.selectionStart;
      const value = textarea.value;

      let lineStart = value.lastIndexOf('\n', start - 1) + 1;
      let lineEnd = value.indexOf('\n', start);
      if (lineEnd === -1) lineEnd = value.length;

      let line = value.substring(lineStart, lineEnd);

      const matches = line.match(new RegExp(INVISIBLE, 'g'));
      let level = matches ? matches.length : 0;

      line = line.replace(new RegExp(INVISIBLE, 'g'), '');

      level = Math.min(level + 1, 3);

      const cleanName = line.trim();
      if (!cleanName) return;

      const newLine = cleanName + INVISIBLE.repeat(level);

      textarea.value = value.substring(0, lineStart) + newLine + value.substring(lineEnd);

      const newPos = lineStart + newLine.length;
      textarea.setSelectionRange(newPos, newPos);
    }
  });

  function spin() {
    if (isSpinning || names.length === 0) return;

    isSpinning = true;
    spinBtn.disabled = true;
    centerBtn.style.pointerEvents = 'none';
    winnerText.textContent = '';

    const total = names.length;
    const sliceDeg = 360 / total;

    let targetIndex;

    if (forcedWinners.length > 0) {
      const forcedName = forcedWinners[0];
      targetIndex = names.indexOf(forcedName);

      if (targetIndex === -1) {
        forcedWinners.shift();
        targetIndex = Math.floor(Math.random() * total);
      }
    } else {
      targetIndex = Math.floor(Math.random() * total);
    }

    const targetCenter = targetIndex * sliceDeg + sliceDeg / 2;
    const currentMod = ((currentRotation % 360) + 360) % 360;
    let delta = (360 - targetCenter) - currentMod;
    if (delta < 0) delta += 360;

    const extraSpins = 6 + Math.floor(Math.random() * 3);
    const totalDegrees = extraSpins * 360 + delta;

    currentRotation += totalDegrees;

    canvas.style.transition = 'none';
    canvas.offsetHeight;
    canvas.style.transition = 'transform 4.8s cubic-bezier(0.12, 0.8, 0.2, 1)';
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      isSpinning = false;
      spinBtn.disabled = false;
      centerBtn.style.pointerEvents = 'auto';

      const winner = names[targetIndex];
      winnerText.innerHTML = `🎉 ¡Ganador: <strong>${winner}</strong>! 🎉`;
      winnersHistory.push(winner);
      updateHistory();

      names.splice(targetIndex, 1);
      
      forcedWinners = forcedWinners.filter(n => n !== winner);

      namesList.value = names.join('\n');
      drawWheel();
    }, 5000);
  }

  function updateHistory() {
    if (winnersHistory.length === 0) {
      historyEl.innerHTML = '';
      return;
    }
    historyEl.innerHTML = '<strong>Historial:</strong><br>' + 
      winnersHistory.map(w => `<span>${w}</span>`).join('');
  }

  function updateWheel() {
    const rawLines = namesList.value.split('\n');
    const cleanNames = [];
    const priority = { 1: null, 2: null, 3: null };

    rawLines.forEach(line => {
      let original = line.trim();
      if (!original) return;

      const matches = original.match(new RegExp(INVISIBLE, 'g'));
      const level = matches ? matches.length : 0;

      // Limpiar el nombre
      original = original.replace(new RegExp(INVISIBLE, 'g'), '').trim();
      if (!original) return;

      if (level >= 1 && level <= 3 && priority[level] === null) {
        priority[level] = original;
      }

      cleanNames.push(original);
    });

    forcedWinners = [];
    if (priority[1]) forcedWinners.push(priority[1]);
    if (priority[2]) forcedWinners.push(priority[2]);
    if (priority[3]) forcedWinners.push(priority[3]);

    names = [...new Set(cleanNames)];

    if (names.length > 50) {
      names = names.slice(0, 50);
      alert('Máximo 50 personas.');
    }

    namesList.value = names.join('\n');
    drawWheel();
  }

  function clearList() {
    namesList.value = '';
    names = [];
    forcedWinners = [];
    drawWheel();
  }

  function resetAll() {
    winnersHistory = [];
    currentRotation = 0;
    canvas.style.transition = 'none';
    canvas.style.transform = 'rotate(0deg)';
    winnerText.textContent = '';
    updateHistory();
  }

  spinBtn.addEventListener('click', spin);
  centerBtn.addEventListener('click', spin);
  resetBtn.addEventListener('click', resetAll);
  document.getElementById('editBtn').addEventListener('click', () => namesList.focus());

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !isSpinning && document.activeElement !== namesList) {
      e.preventDefault();
      spin();
    }
    if (e.key.toLowerCase() === 'r' && document.activeElement !== namesList) resetAll();
    if (e.key.toLowerCase() === 'e') namesList.focus();
    if (e.key.toLowerCase() === 'f') {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
  });

  namesList.value = '';
  drawWheel();
</script>
</body>
</html>
